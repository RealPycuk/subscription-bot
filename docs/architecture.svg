  <text x="327" y="314" text-anchor="middle" font-size="12" fill="#166534">VLESS Reality, Hysteria2</text>
  <rect x="440" y="250" width="175" height="80" rx="10" fill="#fef9c3" stroke="#ca8a04"/>
