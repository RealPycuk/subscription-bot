name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: flake8
        run: |
          pip install flake8
          flake8 bot --select=E9,F63,F7,F82,F401,F811,F841 --show-source
      - name: Validate JSON configs
        run: |
          for f in config/*.json; do python -m json.tool "$f" > /dev/null && echo "OK $f"; done

  shell:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh server/*.sh

  docker:
    name: Dockerfile lint & build
    runs-on: ubuntu-latest
    needs: [python, shell]
    steps:
      - uses: actions/checkout@v4
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
      - name: Build image
        run: docker build -t subscription-bot:ci .
      - name: Check image runs as non-root
        run: test "$(docker run --rm --entrypoint id subscription-bot:ci -u)" = "10001"
      - name: Validate compose file
        run: |
          cp .env.example .env
          cp config/monitoring.example.json config/monitoring.json
          docker compose config -q

  monitoring:
    name: Monitoring configs & alert tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check config
        run: docker run --rm -v "$PWD/monitoring/prometheus":/p:ro --entrypoint promtool prom/prometheus:v3.2.1 check config /p/prometheus.yml
      - name: promtool test rules (юнит-тесты алертов)
        run: docker run --rm -v "$PWD/monitoring/prometheus":/p:ro -w /p --entrypoint promtool prom/prometheus:v3.2.1 test rules alerts_test.yml
      - name: amtool check-config
        run: docker run --rm -v "$PWD/monitoring/alertmanager":/a:ro --entrypoint amtool prom/alertmanager:v0.28.1 check-config /a/alertmanager.example.yml
      - name: blackbox config check
        run: docker run --rm -v "$PWD/monitoring/blackbox":/b:ro prom/blackbox-exporter:v0.26.0 --config.file=/b/blackbox.yml --config.check
      - name: Grafana dashboards are valid JSON
        run: for f in monitoring/grafana/dashboards/*.json; do python3 -m json.tool "$f" > /dev/null && echo "OK $f"; done
      - name: docker compose config
        run: |
          cp monitoring/.env.example monitoring/.env
          docker compose -f monitoring/docker-compose.yml config -q

  ansible:
    name: Ansible lint & real run (idempotency)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible
        run: |
          pip install "ansible-core==2.17.7" "ansible-lint==24.12.2"
          ansible-galaxy collection install -r requirements.yml -p ./collections
      - name: ansible-lint
        run: ansible-lint --offline site.yml
      - name: Prepare CI secrets
        run: cp group_vars/all/vault.example.yml group_vars/all/vault.yml
      - name: First run — настройка «чистого» сервера (сам раннер)
        run: sudo -E env "PATH=$PATH" ansible-playbook -i inventory/ci.yml site.yml
      - name: Second run — проверка идемпотентности
        run: |
          sudo -E env "PATH=$PATH" ansible-playbook -i inventory/ci.yml site.yml | tee second.log
          grep -qE 'changed=0 +unreachable=0 +failed=0' second.log || { echo "Второй запуск что-то изменил — роль не идемпотентна"; exit 1; }
      - name: Verify server state
        run: |
          sudo ufw status | grep -q "Status: active"
          sudo ufw status | grep -q "8444/tcp.*198.51.100.20"
          systemctl is-active fail2ban
          sudo fail2ban-client status sshd
          sudo sshd -T | grep -q "^passwordauthentication no"
          sudo sshd -T | grep -q "^maxauthtries 3"
          curl -fsS http://127.0.0.1:9090/-/ready
          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsS http://127.0.0.1:9093/-/ready
          curl -fsS http://127.0.0.1:9100/metrics | grep -q node_cpu_seconds_total
          test "$(sudo stat -c '%a %u' /opt/monitoring/alertmanager/bot_token)" = "400 65534"
          test "$(sudo stat -c '%a' /opt/monitoring/.env)" = "600"
