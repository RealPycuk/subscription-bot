name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: flake8
        run: |
          pip install flake8
          flake8 bot --select=E9,F63,F7,F82,F401,F811,F841 --show-source
      - name: Validate JSON configs
        run: |
          for f in config/*.json; do python -m json.tool "$f" > /dev/null && echo "OK $f"; done

  shell:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh server/*.sh

  docker:
    name: Dockerfile lint & build
    runs-on: ubuntu-latest
    needs: [python, shell]
    steps:
      - uses: actions/checkout@v4
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
      - name: Build image
        run: docker build -t subscription-bot:ci .
      - name: Check image runs as non-root
        run: test "$(docker run --rm --entrypoint id subscription-bot:ci -u)" = "10001"
      - name: Validate compose file
        run: |
          cp .env.example .env
          cp config/monitoring.example.json config/monitoring.json
          docker compose config -q

  monitoring:
    name: Monitoring configs & alert tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check config
        run: docker run --rm -v "$PWD/monitoring/prometheus":/p:ro --entrypoint promtool prom/prometheus:v3.2.1 check config /p/prometheus.yml
      - name: promtool test rules (юнит-тесты алертов)
        run: docker run --rm -v "$PWD/monitoring/prometheus":/p:ro -w /p --entrypoint promtool prom/prometheus:v3.2.1 test rules alerts_test.yml
      - name: amtool check-config
        run: docker run --rm -v "$PWD/monitoring/alertmanager":/a:ro --entrypoint amtool prom/alertmanager:v0.28.1 check-config /a/alertmanager.example.yml
      - name: blackbox config check
        run: docker run --rm -v "$PWD/monitoring/blackbox":/b:ro prom/blackbox-exporter:v0.26.0 --config.file=/b/blackbox.yml --config.check
      - name: Grafana dashboards are valid JSON
        run: for f in monitoring/grafana/dashboards/*.json; do python3 -m json.tool "$f" > /dev/null && echo "OK $f"; done
      - name: docker compose config
        run: |
          cp monitoring/.env.example monitoring/.env
          docker compose -f monitoring/docker-compose.yml config -q
