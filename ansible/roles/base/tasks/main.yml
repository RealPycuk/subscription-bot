- name: Установить базовые пакеты
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Часовой пояс
  community.general.timezone:
    name: "{{ timezone }}"

- name: Включить автоматические обновления безопасности
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Swap
  when: swap_size_mb | int > 0
  block:
    - name: Проверить, есть ли swap
      ansible.builtin.command: swapon --show=NAME --noheadings
      register: base_swap
      changed_when: false

    - name: Создать swap-файл
      when: base_swap.stdout | length == 0
      block:
        - name: Выделить файл
          ansible.builtin.command: fallocate -l {{ swap_size_mb }}M /swapfile
          args:
            creates: /swapfile

        - name: Права на swap-файл
          ansible.builtin.file:
            path: /swapfile
            mode: "0600"

        - name: Разметить и включить swap
          ansible.builtin.shell: mkswap /swapfile && swapon /swapfile
          changed_when: true

    - name: Подключать swap при загрузке
      ansible.posix.mount:
        src: /swapfile
        path: none
        fstype: swap
        opts: sw
        state: present
      when: base_swap.stdout | length == 0 or '/swapfile' in base_swap.stdout

- name: Меньше уходить в swap
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
    sysctl_set: true
